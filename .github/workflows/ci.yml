name: "Tests"

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: alekseysidorov-ci
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Run Nix checks"
        run: nix flake check

